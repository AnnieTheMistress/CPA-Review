<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#FCFAFE">
  <title>错题复习 · 学习工作台</title>
  <link rel="stylesheet" href="styles.css?v=20260828-4">
  <link rel="stylesheet" href="workspace.css?v=20261112-2">
  <link rel="stylesheet" href="notes.css?v=20261112-3">
</head>
<body>
  <div id="app" class="app-shell">
    <header class="topbar">
      <button class="brand" data-action="home">错题复习</button>
      <div class="top-actions">
        <label class="exam-switcher" aria-label="选择考试">
          <select id="exam-select"></select>
        </label>
        <button class="icon-button" data-action="search" aria-label="搜索" title="搜索">⌕</button>
        <button class="icon-button" data-action="filters" aria-label="筛选" title="筛选">≡</button>
      </div>
    </header>

    <aside id="exam-sidebar" class="exam-sidebar" aria-label="切换考试"></aside>

    <main id="main" class="main" aria-live="polite">
      <div class="loading">正在载入题库…</div>
    </main>

    <nav class="bottom-nav" aria-label="主导航">
      <button data-view="workspace" class="active"><span>⌂</span>工作台</button>
      <button data-view="practice"><span>✎</span>刷题</button>
      <button data-view="catalog"><span>☷</span>目录</button>
      <button data-view="favorites"><span>☆</span>收藏</button>
      <button data-view="progress"><span>◫</span>进度</button>
    </nav>
  </div>

  <dialog id="search-dialog" class="sheet">
    <form method="dialog" class="sheet-head">
      <h2>搜索</h2><button class="icon-button" value="cancel" aria-label="关闭">×</button>
    </form>
    <input id="search-input" class="text-input" type="search" placeholder="题干、知识点、错因" autocomplete="off">
    <div id="search-results" class="search-results"></div>
  </dialog>

  <dialog id="filter-dialog" class="sheet">
    <form method="dialog" class="sheet-head">
      <h2>筛选</h2><button class="icon-button" value="cancel" aria-label="关闭">×</button>
    </form>
    <div id="filter-content"></div>
  </dialog>

  <dialog id="countdown-dialog" class="sheet" aria-labelledby="countdown-title">
    <form id="countdown-form">
      <div class="sheet-head"><h2 id="countdown-title">设置考试日期</h2><button type="button" class="icon-button" data-workspace="cancel-date" aria-label="关闭">×</button></div>
      <div class="filter-group"><label for="exam-date">当前考试的日期</label><input class="text-input" id="exam-date" type="date" required></div>
      <p id="official-exam-date"></p>
      <p id="countdown-error" role="alert"></p>
      <div class="filter-actions"><button type="button" class="secondary-button" data-workspace="clear-date">恢复官网日期</button><button type="submit" class="primary-button">保存个人日期</button></div>
    </form>
  </dialog>

  <input id="import-file" type="file" accept="application/json" hidden>
  <script src="scheduler.js" defer></script>
  <script src="workspace.js?v=20261112-3" defer></script>
  <script src="notes-store.js?v=20261112-3" defer></script>
  <script src="notes-import.js?v=20261112-3" defer></script>
  <script src="notes-ui.js?v=20261112-3" defer></script>
  <script src="app.js?v=20261112-2" defer></script>
</body>
</html>
